[package]
name = "rscm"
description = "Reproduceable System Configuration Manager"
authors = ["xiaoli-white"]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/rscm-community/rscm"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
mlua = { version = "0.11.6", features = [
    "lua54",
    "vendored",
    "error-send",
    "serde",
] }
serde = { version = "1", features = ["derive"] }
which = "8.0.2"
libc = "0.2.183"
hex = "0.4.3"
sha2 = "0.11.0-rc.5"
serde_json = "1.0.149"
glob = "0.3.3"
tempfile = "3"
toml = "1"
dirs = "6"
fs2 = "0.4"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13.2", features = ["blocking"] }
tar = "0.4.45"
xz2 = "0.1.7"
zstd = "0.13.3"
walkdir = "2.5.0"
nix = { version = "0.31", features = ["user"] }
flate2 = "1"