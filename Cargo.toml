[package]
name = "rscm"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
mlua = { version = "0.11.6", features = ["lua54", "vendored", "error-send"] }
serde = { version = "1", features = ["derive"] }
which = "8.0.2"
libc = "0.2.183"
hex = "0.4.3"
sha2 = "0.11.0-rc.5"
serde_json = "1.0.149"
glob = "0.3.3"
tempfile = "3"
toml = "1.0.6+spec-1.1.0"